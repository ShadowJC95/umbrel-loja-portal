version: "3.7"

services:
  # O Umbrel encaminha a porta da app (umbrel-app.yml: port 5080) para o portal, com o login do Umbrel a frente
  app_proxy:
    environment:
      APP_HOST: portal-gestao_web_1   # <id da app>_<servico>_1
      APP_PORT: 8080

  web:
    # Sem "image:" de proposito: o Umbrel tenta descarregar de um registo todas as imagens com "image:",
    # e a do portal so existe no proprio Umbrel. Em vez disso, cada arranque da app ("up --build") faz um
    # build minimo a partir da imagem local portal-gestao:atual (ver o Dockerfile ao lado), criada pelo
    # instalar-imagem-umbrel.ps1.
    build:
      context: ${APP_DATA_DIR}
      dockerfile: Dockerfile
    user: "1000:1000"   # dono da pasta de dados da app no Umbrel
    init: true
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data   # base de dados + chave SSH + known_hosts
